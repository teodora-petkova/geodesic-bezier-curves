<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Geodesic Bezier Curves</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      pointer-events: none;
      z-index: 10;
      line-height: 1.5;
    }
  </style>
  <!-- Dependencies via CDN -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/utils/BufferGeometryUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.21"></script>
  <script>
    var GUI = lil.GUI;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/earcut/dist/earcut.min.js"></script>

  <script src="geometry-central-js/linear-algebra/emscripten-memory-manager.js"></script>
  <script>
    let memoryManager = new EmscriptenMemoryManager();
  </script>
  <script src="geometry-central-js/linear-algebra/linear-algebra-asm.js"></script>
  <script src="geometry-central-js/linear-algebra/vector.js"></script>
  <script src="geometry-central-js/linear-algebra/dense-matrix.js"></script>
  <script src="geometry-central-js/linear-algebra/sparse-matrix.js"></script>
  <script src="geometry-central-js/core/vertex.js"></script>
  <script src="geometry-central-js/core/edge.js"></script>
  <script src="geometry-central-js/core/face.js"></script>
  <script src="geometry-central-js/core/halfedge.js"></script>
  <script src="geometry-central-js/core/corner.js"></script>
  <script src="geometry-central-js/core/mesh.js"></script>
  <script src="geometry-central-js/core/geometry.js"></script>
  <script src="geometry-central-js/utils/meshio.js"></script>
  <script src="geometry-central-js/utils/colormap.js"></script>

</head>

<body>
  <script type="module" src="src/init.js">
  </script>

  <div id="ui-panel">
    <details id="controls-panel">
      <summary style="cursor: pointer;font-weight: bold;">Geodesic Bezier Curves</summary>

      <div class="control-group">
          <label for="meshSelect">Choose Preloaded Mesh</label>
          <div class="select-wrap">
          <select id="meshSelect">
            <option
              value="https://raw.githubusercontent.com/teodora-petkova/geodesic-bezier-curves/refs/heads/main/models/cube.obj">
              Cube</option>
            <option
              value="https://raw.githubusercontent.com/teodora-petkova/geodesic-bezier-curves/refs/heads/main/models/cat_head.obj">
              Cat</option>
            <option
              value="https://raw.githubusercontent.com/teodora-petkova/geodesic-bezier-curves/refs/heads/main/models/torus.obj">
              Torus</option>
            <option
              value="https://raw.githubusercontent.com/teodora-petkova/geodesic-bezier-curves/refs/heads/main/models/spot.obj">
              Spot Cow</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label for="fileInput">Load Custom Mesh (.obj)</label>
        <input type="file" id="fileInput" accept=".obj">
      </div>

      <div class="control-group">
        <button class="btn" id="clearPathBtn">Clear Selected Path</button>
      </div>

      <div class="mode-picker">
        <label for="algorithm">Algorithm</label>
        <div class="select-wrap">
          <select id="algorithm">
            <option value="bezier_curve" selected>Find Cubic Geodesic Bezier Curve</option>
            <option value="geodesic_path">Find Geodesic Path</option>
          </select>
        </div>
      </div>

      <div id="geodesicControls" class="mode-hint">
        Select 2 points to find the geodesic path between them.
      </div>

      <div id="bezierControls" class="mode-hint">
        <p class="mode-hint__text">Select 4 control points for the Bezier curve.</p>

        <div class="checkbox-row">
          <input type="checkbox" id="toggleBezierPoints">
          <label for="toggleBezierPoints">Show Bezier Sample Points</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="toggleBezierHandleLines">
          <label for="toggleBezierHandleLines">
            Show Bezier Helper Handle Lines/Points for the Midpoint
          </label>
        </div>
      </div>

      <div class="checkbox-row shared-control">
        <input type="checkbox" id="togglePathPoints">
        <label for="togglePathPoints">Show Path Points</label>
      </div>

      <div id="instructions">
        <strong>Controls:</strong>
        • <b>Select Path Endpoints:</b> Shift + Left-Click on mesh surface.<br>
        • <b>Rotate:</b> Left-Click + Drag<br>
        • <b>Pan:</b> Right-Click + Drag / Ctrl+Drag<br>
      </div>
    </details>
  </div>

  <div id="loading-overlay" class="hidden" aria-live="polite" aria-hidden="true">
    <div class="loading-content">
      <img src="assets/loading.gif" alt="Loading" />
      <div>Computing ...</div>
    </div>
  </div>

</body>

</html>
