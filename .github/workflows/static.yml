# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
       
      # keep only index.html, src/, and cgal_wasm/compiled/
      - name: Clean up everything except required web assets
        run: |
          # 1. Temporarily move your precious web files safely out of the workspace
          mv index.html ./temp_index.html
          mv src ./temp_src
          mv cgal_wasm/compiled ./temp_compiled
          
          # 2. Completely nuke everything remaining in the root folder (including hidden files)
          rm -rf * .[^.]* ..?* 2>/dev/null || true
          
          # 3. Recreate the exact structure you want for the website deployment
          mv ./temp_index.html ./index.html
          mv ./temp_src ./src
          mkdir -p cgal_wasm
          mv ./temp_compiled ./cgal_wasm/compiled
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
